version: 2
updates:
  # Python deps via uv. Dependabot understands pyproject.toml + uv.lock
  # natively (the "uv" ecosystem is the right key as of Dependabot's
  # 2025 release; "pip" still works as a fallback).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"

  # Frontend deps. Group minors so we don't drown in PRs from React /
  # Three.js patch streams.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      web-minor:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "web"

  # GitHub Actions versions drift quietly. Keep them current so we
  # don't suddenly break on a sunset runner image.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
