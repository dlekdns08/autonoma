name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: README sync check
        run: |
          # README.md and README.ko.md are kept feature-parity. If they
          # drift by more than 30 lines, the Korean copy is likely stale
          # — fail loudly so the PR author updates it.
          en_lines=$(wc -l < README.md)
          ko_lines=$(wc -l < README.ko.md)
          diff=$(( en_lines > ko_lines ? en_lines - ko_lines : ko_lines - en_lines ))
          echo "README.md=$en_lines lines, README.ko.md=$ko_lines lines, diff=$diff"
          if [ "$diff" -gt 30 ]; then
            echo "::warning::README.md and README.ko.md differ by $diff lines — please sync."
          fi

      - name: Run Python tests
        run: uv run pytest tests/ -v --tb=short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web
        run: npm run build
