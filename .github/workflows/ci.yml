name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    # Configurable runner with a GitHub-hosted fallback: set the
    # repository/org variable ``CI_RUNNER`` (e.g. ``self-hosted``) to
    # pin a runner; when it is unset the expression evaluates to the
    # empty string and ``||`` falls through to ``ubuntu-latest``.
    # ``vars`` is one of the contexts available to ``runs-on``.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Hard ceiling so a hung model download / stuck test can't pin a
    # runner for the default 360 minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (pyright)
        # Non-blocking for now: pyright in basic mode still catches
        # high-signal issues, but ~70 errors remain spread across the
        # tree (``draft.py``, ``tui/renderer.py``, ``mocap/validator.py``,
        # a tail of tests, ...). Drop the ``|| true`` once ``uv run
        # pyright`` is clean — the output is still surfaced in the log.
        run: uv run pyright || true

      - name: README sync check
        run: |
          # README.md and README.ko.md are kept feature-parity. If they
          # drift by more than 30 lines, the Korean copy is likely stale
          # — fail loudly so the PR author updates it.
          en_lines=$(wc -l < README.md)
          ko_lines=$(wc -l < README.ko.md)
          diff=$(( en_lines > ko_lines ? en_lines - ko_lines : ko_lines - en_lines ))
          echo "README.md=$en_lines lines, README.ko.md=$ko_lines lines, diff=$diff"
          if [ "$diff" -gt 30 ]; then
            echo "::warning::README.md and README.ko.md differ by $diff lines — please sync."
          fi

      - name: Run Python tests with coverage
        # Threshold is set to 55% — slightly below the current 58%
        # baseline so we catch regressions without forcing a coverage
        # push every PR. Bump as the suite grows.
        run: |
          uv run pytest tests/ \
            --cov=src/autonoma \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=55 \
            -v

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            # Pull the line-rate attribute out of coverage.xml without
            # adding another dep (jq/python-xml). Surfaces the headline
            # number in the GitHub Actions summary.
            rate=$(grep -oE 'line-rate="[0-9.]+"' coverage.xml | head -1 | grep -oE '[0-9.]+')
            pct=$(awk "BEGIN { printf \"%.1f\", $rate * 100 }")
            echo "## Coverage: ${pct}%" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Frontend tests (Vitest)
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

  e2e:
    name: E2E & visual (Playwright)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The backend is mocked inside the tests (e2e/support/mockBackend.ts);
      # playwright.config.ts builds and starts the app itself.
      # ``--update-snapshots=missing``: baselines are per-OS; until the
      # Linux ones are committed this run writes them (and passes) and the
      # artifact below carries them — download, review, commit.
      - name: Playwright
        working-directory: web
        run: npx playwright test --update-snapshots=missing

      - name: Upload report and new baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            web/e2e/.report
            web/e2e/.results
            web/e2e/__screenshots__
          retention-days: 14
