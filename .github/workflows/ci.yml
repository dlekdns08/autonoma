name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (pyright)
        # Non-blocking for now: pyright in basic mode still catches
        # high-signal issues, but the legacy 4000-line modules carry
        # a backlog. Failing here would block every PR until that
        # backlog is paid down. Tighten to a hard gate once
        # ``typeCheckingMode`` graduates to ``standard``.
        run: uv run pyright || true

      - name: README sync check
        run: |
          # README.md and README.ko.md are kept feature-parity. If they
          # drift by more than 30 lines, the Korean copy is likely stale
          # — fail loudly so the PR author updates it.
          en_lines=$(wc -l < README.md)
          ko_lines=$(wc -l < README.ko.md)
          diff=$(( en_lines > ko_lines ? en_lines - ko_lines : ko_lines - en_lines ))
          echo "README.md=$en_lines lines, README.ko.md=$ko_lines lines, diff=$diff"
          if [ "$diff" -gt 30 ]; then
            echo "::warning::README.md and README.ko.md differ by $diff lines — please sync."
          fi

      - name: Run Python tests with coverage
        # Threshold is set to 55% — slightly below the current 58%
        # baseline so we catch regressions without forcing a coverage
        # push every PR. Bump as the suite grows.
        run: |
          uv run pytest tests/ \
            --cov=src/autonoma \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=55 \
            -v

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            # Pull the line-rate attribute out of coverage.xml without
            # adding another dep (jq/python-xml). Surfaces the headline
            # number in the GitHub Actions summary.
            rate=$(grep -oE 'line-rate="[0-9.]+"' coverage.xml | head -1 | grep -oE '[0-9.]+')
            pct=$(awk "BEGIN { printf \"%.1f\", $rate * 100 }")
            echo "## Coverage: ${pct}%" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Frontend tests (Vitest)
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build
